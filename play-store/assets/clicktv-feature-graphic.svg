    <text x="100" y="54" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">ClickTV</text>
    <text x="0" y="162" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Sua comunicação</text>
    <text x="0" y="220" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">em todas as telas</text>
