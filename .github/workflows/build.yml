name: Validate ClickManager TV Player

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "nginx.conf"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build:prod

      - name: Validate Docker image
        run: docker build -t clickmanager-tv-player:ci .
